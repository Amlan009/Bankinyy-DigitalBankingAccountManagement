spring.application.name=bankingapp
# MySQL Database Connection
# On another PC, set MYSQL_URL / MYSQL_USER / MYSQL_PASSWORD (see README)
# or edit the values after the colons below.
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/banking_db?createDatabaseIfNotExist=true}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:Amlan@2003}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# JWT Secret Key (for stateless security)
# IMPORTANT: Replace this with a long, random, secure string
app.jwt.secret=REALLY_LONG_RANDOM_SECURE_KEY_YOU_GENERATED_THAT_IS_AT_LEAST_64_CHARS_LONG!@#$%^&*()_+
app.jwt.expiration-ms=86400000
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
